function renderAdminNotifications(){
  const publicEnabled=configBool('PUBLIC_FORM_ENABLED',true);
  const emailEnabled=configBool('EMAIL_NOTIFICATIONS_ENABLED',false);

  $('tab_notifications').innerHTML=
    '<div class="section-title">Publicación y notificaciones</div>'+ 
    '<div class="admin-row">'+
      '<label style="display:flex;align-items:center;gap:8px"><input id="publicEnabledAdmin" type="checkbox" '+(publicEnabled?'checked':'')+' style="width:auto;transform:scale(1.2)"> Habilitar formulario para pruebas / uso público</label>'+ 
      '<div class="help">Este interruptor abre o cierra el formulario dentro de la app. Para que personas sin tu cuenta puedan entrar, la implementación de Google debe estar configurada una vez como <strong>Cualquier persona</strong>.</div>'+ 
      '<div style="margin-top:10px"><label>Mensaje cuando esté cerrado</label><input id="publicClosedMessageAdmin" value="'+attr(state.config.PUBLIC_CLOSED_MESSAGE||'Control temporalmente cerrado para ajustes.')+'"></div>'+ 
    '</div>'+ 
    '<div class="admin-row" style="margin-top:12px">'+
      '<label style="display:flex;align-items:center;gap:8px"><input id="emailEnabledAdmin" type="checkbox" '+(emailEnabled?'checked':'')+' style="width:auto;transform:scale(1.2)"> Enviar correo al entregar cada control</label>'+ 
      '<div style="margin-top:10px"><label>Correos destinatarios</label><textarea id="emailRecipientsAdmin" placeholder="jefe@empresa.cl; supervisor@empresa.cl">'+esc(state.config.EMAIL_RECIPIENTS||'')+'</textarea><div class="help">Puedes separar varios correos con coma, punto y coma o una línea nueva.</div></div>'+ 
      '<div class="grid" style="margin-top:10px">'+
        '<div><label>Nombre visible del remitente</label><input id="emailSenderNameAdmin" value="'+attr(state.config.EMAIL_SENDER_NAME||'Control Dewatering - MCM')+'"><div class="help">Este nombre aparecerá en Gmail junto a la dirección real de envío.</div></div>'+
        '<div><label>Logo MCM dentro del correo</label><input id="emailLogoFileAdmin" type="file" accept="image/*"><button type="button" class="secondary-button" style="margin-top:8px" onclick="uploadEmailLogo()">Subir logo MCM</button><div class="help">'+(state.config.EMAIL_LOGO_FILE_ID?'✓ Logo configurado':'Aún no hay logo configurado')+'</div></div>'+
      '</div>'+
      '<div class="grid" style="margin-top:10px">'+
        '<div><label>Asunto</label><input id="emailSubjectAdmin" value="'+attr(state.config.EMAIL_SUBJECT||'Nuevo Control Dewatering - {fecha} - Turno {turno}')+'"><div class="help">Variables disponibles: {fecha}, {turno}, {jornada}, {supervisor}, {trabajador}, {id}</div></div>'+ 
        '<div><label>Texto inicial</label><input id="emailIntroAdmin" value="'+attr(state.config.EMAIL_INTRO||'Se ha recibido un nuevo control de flujos Dewatering.')+'"></div>'+ 
      '</div>'+ 
    '</div>'+ 
    '<div class="admin-toolbar">'+
      '<button class="main-button" onclick="saveNotificationSettings()">Guardar configuración</button>'+ 
      '<button class="secondary-button" onclick="sendTestEmail()">Enviar correo de prueba</button>'+ 
    '</div>'+ 
    '<div class="help"><strong>Registro:</strong> cada envío sigue quedando en REGISTROS y además se crea una fila resumen en RONDAS.</div>';
}

function saveNotificationSettings(){
  // Guardar solamente la configuración de esta pestaña.
  // Así no se reenvían al Sheet los logos que la app carga temporalmente
  // como data:image para mostrarlos en pantalla.
  const obj={
    PUBLIC_FORM_ENABLED:$('publicEnabledAdmin').checked?'TRUE':'FALSE',
    PUBLIC_CLOSED_MESSAGE:$('publicClosedMessageAdmin').value,
    EMAIL_NOTIFICATIONS_ENABLED:$('emailEnabledAdmin').checked?'TRUE':'FALSE',
    EMAIL_RECIPIENTS:$('emailRecipientsAdmin').value,
    EMAIL_SENDER_NAME:$('emailSenderNameAdmin').value,
    EMAIL_SUBJECT:$('emailSubjectAdmin').value,
    EMAIL_INTRO:$('emailIntroAdmin').value
  };

  adminStatus('Guardando configuración…');
  google.script.run
    .withSuccessHandler(data=>{
      state.config=data.config||Object.assign({},state.config,obj);
      applyConfig();
      renderAdminNotifications();
      adminStatus('Configuración guardada.');
    })
    .withFailureHandler(e=>adminStatus(e.message,true))
    .adminSaveConfig(state.adminPin,obj);
}


function uploadEmailLogo(){
  const input=$('emailLogoFileAdmin');

  if(!input||!input.files||!input.files[0]){
    adminStatus('Selecciona primero una imagen para el logo del correo.',true);
    return;
  }

  const file=input.files[0];

  if(file.size>5*1024*1024){
    adminStatus('El logo debe pesar menos de 5 MB.',true);
    return;
  }

  adminStatus('Subiendo logo del correo…');

  const reader=new FileReader();

  reader.onerror=()=>adminStatus('No se pudo leer la imagen.',true);

  reader.onload=()=>{
    const base64=String(reader.result||'').split(',')[1]||'';

    google.script.run
      .withSuccessHandler(r=>{
        state.config.EMAIL_LOGO_FILE_ID=r.fileId||'';
        renderAdminNotifications();
        adminStatus('Logo del correo guardado correctamente.');
      })
      .withFailureHandler(e=>adminStatus(e.message,true))
      .adminUploadEmailLogo(
        state.adminPin,
        file.name,
        file.type,
        base64
      );
  };

  reader.readAsDataURL(file);
}

function sendTestEmail(){
  adminStatus('Enviando correo de prueba…');
  google.script.run
    .withSuccessHandler(r=>adminStatus('Correo de prueba enviado a: '+(r.recipients||[]).join(', ')))
    .withFailureHandler(e=>adminStatus(e.message,true))
    .adminSendTestEmail(state.adminPin);
}

function renderAdminSecurity(){
  $('tab_security').innerHTML='<div class="section-title">Seguridad</div><div class="admin-grid">'+
    '<div><label>PIN actual</label><input id="currentPinChange" type="password"></div>'+
    '<div><label>Nuevo PIN</label><input id="newPinChange" type="password"></div></div>'+
    '<div class="admin-toolbar"><button class="main-button" onclick="changePin()">Cambiar PIN</button></div>'+
    '<div class="help">El PIN protege únicamente la edición. Los trabajadores siguen usando la app normalmente.</div>';
}

function changePin(){
  const current=$('currentPinChange').value,newPin=$('newPinChange').value;
  google.script.run.withSuccessHandler(()=>{state.adminPin=newPin;$('currentPinChange').value='';$('newPinChange').value='';adminStatus('PIN cambiado correctamente.');}).withFailureHandler(e=>adminStatus(e.message,true)).changeAdminPin(current,newPin);
}

function refreshAdminData(msg){
  google.script.run.withSuccessHandler(data=>{
    state.adminRaw=data.admin;state.config=data.config||state.config;state.sections=data.sections||state.sections;state.equipment=data.equipment||state.equipment;state.fields=data.fields||state.fields;state.options=data.options||state.options;
    renderAdminAll();applyConfig();renderApp();adminStatus(msg);
  }).withFailureHandler(e=>adminStatus(e.message,true)).getAdminData(state.adminPin);
}

function fieldInput(label,cls,value,type='text'){return '<div><label>'+esc(label)+'</label><input class="'+cls+'" type="'+type+'" value="'+attr(value==null?'':value)+'"></div>'}
function checkboxInput(label,cls,checked){return '<div><label>'+esc(label)+'</label><input class="'+cls+'" type="checkbox" '+(checked?'checked':'')+' style="width:auto;transform:scale(1.25);margin:9px"></div>'}
function selectStatic(label,cls,values,current){let o='';values.forEach(v=>o+='<option '+(String(v)===String(current)?'selected':'')+'>'+esc(v)+'</option>');return '<div><label>'+esc(label)+'</label><select class="'+cls+'">'+o+'</select></div>'}

function adminStatus(msg,isError=false){const el=$('adminStatus');el.textContent=msg;el.style.color=isError?'#B42318':'#157347'}

/* ================= UTIL ================= */
function showError(text){$('errorBox').textContent=text;$('errorBox').classList.add('show');$('errorBox').scrollIntoView({behavior:'smooth'})}
function hideError(){$('errorBox').classList.remove('show');$('errorBox').textContent=''}
function showFatal(err){$('loading').innerHTML='<strong>No se pudo cargar la aplicación.</strong><br><br>'+esc(err&&err.message?err.message:String(err))}
function fieldKey(v){
  return String(v == null ? '' : v).trim().toLowerCase();
}

function makeId(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function attr(s){return esc(s).replace(/`/g,'&#096;')}
</script>
